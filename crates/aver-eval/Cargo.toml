[package]
name = "aver-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
default-run = "aver-eval"

[dependencies]
aver-core = { path = "../aver-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# Direct-vs-MCP BEAM parity test: serves aver-server in-process.
aver-server = { path = "../aver-server" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false, features = ["net", "rt-multi-thread", "time"] }

[[bin]]
name = "aver-beam100k"
path = "src/bin/aver-beam100k.rs"
