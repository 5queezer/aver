name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            suffix: linux-aarch64
          - os: macos-13
            suffix: darwin-x86_64
          - os: macos-14
            suffix: darwin-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI and server
        run: cargo build --release --locked -p aver-cli -p aver-server

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for bin in aver aver-server; do
            strip "target/release/$bin"
            tar -C target/release -czf "dist/$bin-${{ matrix.suffix }}.tar.gz" "$bin"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aver-${{ matrix.suffix }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble systemd unit and checksums
        run: |
          cp contrib/systemd/aver-mcp.service dist/aver-mcp.service
          cd dist
          sha256sum -- *.tar.gz aver-mcp.service > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/aver-mcp.service
            dist/SHA256SUMS

      - name: Keep assets for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist
